<style>
        body {
            background-color: #fff9ec;
            overflow: hidden;
        }
        .language-chip-active {
            @apply bg-primary-container text-on-primary-container border-transparent;
        }
        .pulse-animation {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .bg-pattern {
            background-image: radial-gradient(#1b5e20 0.5px, transparent 0.5px);

<body class="flex flex-col min-h-screen relative font-body-md text-on-surface">
<!-- Atmospheric Background Pattern -->
<div class="absolute inset-0 bg-pattern pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-between px-md py-xl z-10 w-full max-w-md mx-auto">
<!-- Header Branding Section -->
<div class="flex flex-col items-center mt-xl text-center">
<!-- App Logo Container -->
<div class="w-32 h-32 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center mb-lg relative overflow-hidden">
<!-- Subtle Gradient Glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
<span class="material-symbols-outlined text-primary text-[64px] relative z-10" style="font-variation-settings: 'FILL' 1;">
                    eco
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs tracking-tight">KisanMitra</h1>
<div class="flex flex-col gap-base">
<p class="font-body-md text-body-md text-on-surface-variant px-md">
                    Smart crop decisions for maximum profit
                </p>
<p class="font-body-md text-body-md text-primary opacity-80 font-medium">
                    मुनाफे के लिए स्मार्ट फसल सलाह
                </p>
</div>
</div>
<!-- Language Selection Section -->
<div class="w-full mt-xl">
<h2 class="font-label-lg text-label-lg text-on-surface-variant text-center mb-md">Select Language / भाषा चुनें</h2>
<!-- Language Chips Container (Bento-style horizontal scroll simulation) -->
<div class="flex flex-wrap justify-center gap-sm">
<button class="language-chip flex items-center justify-center h-touch-target px-lg rounded-full border-2 border-outline-variant bg-surface-container-low font-label-lg text-label-lg transition-all active:scale-95 language-chip-active" onclick="selectLanguage(this)">
                    English
                </button>
<button class="language-chip flex items-center justify-center h-touch-target px-lg rounded-full border-2 border-outline-variant bg-surface-container-low font-label-lg text-label-lg transition-all active:scale-95" onclick="selectLanguage(this)">
                    हिंदी
                </button>
<button class="language-chip flex items-center justify-center h-touch-target px-lg rounded-full border-2 border-outline-variant bg-surface-container-low font-label-lg text-label-lg transition-all active:scale-95" onclick="selectLanguage(this)">
                    मराठी
                </button>
<button class="language-chip flex items-center justify-center h-touch-target px-lg rounded-full border-2 border-outline-variant bg-surface-container-low font-label-lg text-label-lg transition-all active:scale-95" onclick="selectLanguage(this)">
                    தமிழ்
                </button>
<button class="language-chip flex items-center justify-center h-touch-target px-lg rounded-full border-2 border-outline-variant bg-surface-container-low font-label-lg text-label-lg transition-all active:scale-95" onclick="selectLanguage(this)">
                    తెలుగు
                </button>
</div>
</div>
<!-- Footer Action Section -->
<div class="w-full flex flex-col gap-lg items-center mt-xl">
<!-- Secondary Illustration or Decorative Element -->

</div>

</div>
<!-- Primary Continue Button -->
<button class="w-full h-touch-target bg-primary text-white rounded-full font-headline-sm text-headline-sm shadow-md active:scale-95 transition-transform flex items-center justify-center gap-sm">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>

</main>
<!-- Micro-interaction Script -->
<script>
        function selectLanguage(element) {
            // Remove active classes from all chips
            document.querySelectorAll('.language-chip').forEach(chip => {
                chip.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-transparent', 'language-chip-active');
                chip.classList.add('border-outline-variant', 'bg-surface-container-low');
            });
            
            // Add active classes to selected chip
            element.classList.remove('border-outline-variant', 'bg-surface-container-low');
            element.classList.add('bg-primary-container', 'text-on-primary-container', 'border-transparent', 'language-chip-active');

            // Visual feedback on click
            element.style.transform = 'scale(0.95)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 100);
        }

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(20px)';
            mainContent.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
            
            requestAnimationFrame(() => {
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            });
        });
    </script>
</body></html>
