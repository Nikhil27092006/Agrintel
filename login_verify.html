<style>
        body { background-color: #fff9ec; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            border-bottom-color: #00450d;
            background-color: #f4eddd;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .voice-pulse::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #fcab28;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }
        .screen-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }
    </style>

<body class="font-body-md text-on-surface antialiased overflow-hidden">
<!-- Top App Bar (Simplified for Login) -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center h-touch-target px-md w-full z-10">
<div class="flex items-center gap-sm">
<span class="font-headline-md text-headline-md text-primary">KisanMitra</span>
</div>
<div class="text-on-surface-variant font-label-sm text-label-sm">
            English / हिंदी
        </div>
</header>
<main class="relative h-[calc(100vh-56px)] flex items-center justify-center p-md">
<!-- Background Decoration (Subtle Digital Stewardship Vibe) -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-20 right-5 w-80 h-80 bg-secondary-container/10 rounded-full blur-3xl"></div>
</div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(27,94,32,0.08)] p-lg relative overflow-hidden">
<!-- Step 1: Phone Entry -->
<section class="screen-transition flex flex-col gap-xl" id="phone-step">
<div class="space-y-base">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary leading-tight">
                        Enter your<br/>Phone Number
                    </h1>
<p class="text-on-surface-variant font-body-md text-body-md">
                        We will send a 6-digit code to verify your identity.
                    </p>
</div>
<div class="space-y-md">
<label class="block group">
<span class="font-label-sm text-label-sm text-on-surface-variant ml-1">Mobile Number</span>
<div class="flex items-center bg-surface-container-low border-b-2 border-tertiary-fixed-variant px-md h-touch-target">
<span class="font-headline-sm text-headline-sm text-on-surface-variant mr-sm">+91</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-headline-sm text-headline-sm text-primary placeholder:text-outline-variant" maxlength="10" placeholder="98765 43210" type="tel"/>
</div>
</label>
<button class="w-full h-touch-target bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-md active:scale-95 transition-transform flex items-center justify-center gap-sm" onclick="goToOtp()">
                        Send OTP
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<div class="flex items-center justify-center gap-sm py-sm">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<button class="w-full h-touch-target border-2 border-outline-variant text-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm">
<img class="w-6 h-6" data-alt="A clean, minimalist vector icon representing a digital government ID card for official agricultural portals, following a high-contrast green and white color scheme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOitxX5SSJoQ489EGAXwqo9MYK693U1r7IFHFtWSwaMsUG6nh5nTomHjHzN3iwuEBN7Gtt7ybI8oypd9kkBSOif5qVkMOpbNMJ61x0daZAe7iF_4_Y8exXLKzA4WXlzEQOmnlX5fRHjaXAJpLTZAIMR3mcR_ahBoxgbVeWj-ScFTZqN8qsgFCxDAHlYVk72DfZ69B4G5I3dbAdVf19-lBHNRQFXFTgQTGpRMtM2pEfwukUJHo6XVJLlg"/>
                    Login with Kisan ID
                </button>
</section>
<!-- Step 2: OTP Verification (Hidden by default) -->
<section class="screen-transition absolute inset-0 bg-surface-container-lowest p-lg flex flex-col gap-xl translate-x-full opacity-0 pointer-events-none" id="otp-step">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors -ml-2" onclick="goToPhone()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="space-y-base">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">
                        Verify OTP
                    </h1>
<p class="text-on-surface-variant font-body-md text-body-md">
                        Sent to <span class="font-bold text-on-surface">+91 98765 43210</span>
</p>
</div>
<div class="space-y-lg">
<div class="flex justify-between gap-xs">
<!-- 6 OTP Boxes -->
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-low border-b-2 border-tertiary-fixed-variant text-center font-headline-md text-headline-md text-primary rounded-t-lg transition-all focus:ring-0 outline-none" maxlength="1" type="text"/>
</div>
<div class="flex flex-col items-center gap-xs">
<p class="text-on-surface-variant font-label-sm text-label-sm" id="timer">Resend code in <span class="text-secondary font-bold">0:59</span></p>
<button class="text-primary font-label-lg text-label-lg opacity-50 cursor-not-allowed" disabled="" id="resend-btn">Resend OTP</button>
</div>
<button class="w-full h-touch-target bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-md active:scale-95 transition-transform">
                        Verify
                    </button>
</div>
</section>
</div>
</main>
<!-- Voice Assistance FAB (Knowledgeable Neighbor Vibe) -->
<div class="fixed bottom-xl right-md flex flex-col items-end gap-sm">
<div class="bg-primary-container text-on-primary-container px-md py-xs rounded-xl shadow-md text-label-sm font-label-sm mb-2 opacity-0 transition-opacity" id="voice-tooltip">
            "Need help logging in?"
        </div>
<button class="voice-pulse w-[72px] h-[72px] bg-secondary-container text-on-secondary-container rounded-full shadow-[0px_8px_24px_rgba(0,0,0,0.12)] flex items-center justify-center relative z-20" onmouseout="hideTooltip()" onmouseover="showTooltip()">
<span class="material-symbols-outlined text-[32px]">mic</span>
</button>
</div>
<script>
        function goToOtp() {
            const phoneStep = document.getElementById('phone-step');
            const otpStep = document.getElementById('otp-step');
            
            phoneStep.classList.add('-translate-x-full', 'opacity-0', 'pointer-events-none');
            otpStep.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            
            startTimer();
            // Focus first OTP input
            setTimeout(() => {
                document.querySelector('.otp-input').focus();
            }, 500);
        }

        function goToPhone() {
            const phoneStep = document.getElementById('phone-step');
            const otpStep = document.getElementById('otp-step');
            
            phoneStep.classList.remove('-translate-x-full', 'opacity-0', 'pointer-events-none');
            otpStep.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
        }

        function showTooltip() {
            document.getElementById('voice-tooltip').style.opacity = '1';
        }
        function hideTooltip() {
            document.getElementById('voice-tooltip').style.opacity = '0';
        }

        function startTimer() {
            let timeLeft = 59;
            const timerElement = document.querySelector('#timer span');
            const resendBtn = document.getElementById('resend-btn');
            
            const interval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    document.getElementById('timer').classList.add('hidden');
                    resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    resendBtn.disabled = false;
                } else {
                    timeLeft--;
                    timerElement.textContent = `0:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
                }
            }, 1000);
        }

        // Auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
